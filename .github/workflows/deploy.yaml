name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Build only (no deploy) so a broken build fails the PR.
  pull_request:
  workflow_dispatch:
  # Rebuild daily so the project list (stars, new repos) stays fresh.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate
        env:
          # Built-in token is enough to lift the anonymous GitHub API rate limit.
          NUXT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm generate

      - name: Add .nojekyll
        if: github.event_name != 'pull_request'
        run: touch .output/public/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: .output/public
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
